<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Central DB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f8f9fb;
  --border:#e2e5ea;--border2:#cdd2db;
  --text:#1a1d23;--text2:#5a6072;--text3:#8891a4;
  --teal:#0f8c6e;--teal-light:#e1f5ee;--teal-mid:#1da87f;
  --red:#c0392b;
  --shadow:0 1px 4px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.10);
}
html,body{width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden;}
.screen{display:none;}
.screen.active{display:flex;}

/* LOGIN GERAL */
#screen-login{
  flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 26px;width:100%;max-width:340px;text-align:center;box-shadow:var(--shadow-md);}
.login-logo{width:48px;height:48px;background:var(--teal);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;}
.login-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:22px;}

.pinpad-dots{display:flex;justify-content:center;gap:13px;margin-bottom:16px;}
.pinpad-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s;}
.pinpad-dot.filled{background:var(--teal);border-color:var(--teal);}
.pinpad-dot.error{background:var(--red)!important;border-color:var(--red)!important;}
.pinpad-input{width:170px;display:block;margin:0 auto 8px;text-align:center;font-size:22px;font-weight:700;letter-spacing:8px;padding:10px;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);font-family:inherit;}
.pinpad-input:focus{outline:none;border-color:var(--teal);}
.pin-error{font-size:13px;color:var(--red);min-height:18px;margin-bottom:6px;}
.pinpad-num{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:6px auto 0;}
.pinpad-btn{padding:14px 0;font-size:18px;font-weight:600;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface2);cursor:pointer;font-family:inherit;color:var(--text);transition:all .12s;-webkit-tap-highlight-color:transparent;}
.pinpad-btn:active{transform:scale(.94);background:var(--teal);color:#fff;border-color:var(--teal);}
.pinpad-ok{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}

/* MENU */
#screen-menu{
  flex-direction:column;min-height:100vh;background:var(--bg);
}
.menu-topbar{
  background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:10px;
}
.menu-topbar .t{font-size:16px;font-weight:800;color:var(--text);text-align:center;}
.menu-body{flex:1;padding:26px 20px;max-width:520px;width:100%;margin:0 auto;}
.menu-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.menu-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px 14px;text-align:center;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);
}
.menu-card:hover{border-color:var(--teal-mid);background:var(--teal-light);}
.menu-card:active{transform:scale(.96);}
.menu-card .ic{font-size:30px;}
.menu-card .lbl{font-size:13px;font-weight:700;color:var(--text);}

/* APP VIEWER */
#screen-viewer{flex-direction:column;min-height:100vh;background:var(--bg);position:relative;}
#viewer-bar{
  background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;
}
#viewer-bar button{
  background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:7px 12px;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--text);cursor:pointer;transition:background .15s;
}
#viewer-bar button:hover{background:var(--teal-light);}
#viewer-bar .app-name{font-size:14px;font-weight:700;color:var(--text);}
#app-frame{flex:1;width:100%;border:none;background:#fff;}
#viewer-loading{
  position:absolute;inset:0;top:52px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text3);font-size:13px;font-weight:600;
}
</style>
</head>
<body>

<!-- TELA 1: LOGIN GERAL DA CENTRAL -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">🗂️</div>
    <div class="login-title">Central DB</div>
    <div class="login-sub">Digite a senha geral para continuar</div>

    <div class="pinpad-dots" id="pin-dots">
      <span class="pinpad-dot" id="dot-0"></span>
      <span class="pinpad-dot" id="dot-1"></span>
      <span class="pinpad-dot" id="dot-2"></span>
      <span class="pinpad-dot" id="dot-3"></span>
    </div>
    <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
      class="pinpad-input" placeholder="••••">
    <div class="pin-error" id="pin-error"></div>
    <div class="pinpad-num">
      <button type="button" class="pinpad-btn" data-d="1">1</button>
      <button type="button" class="pinpad-btn" data-d="2">2</button>
      <button type="button" class="pinpad-btn" data-d="3">3</button>
      <button type="button" class="pinpad-btn" data-d="4">4</button>
      <button type="button" class="pinpad-btn" data-d="5">5</button>
      <button type="button" class="pinpad-btn" data-d="6">6</button>
      <button type="button" class="pinpad-btn" data-d="7">7</button>
      <button type="button" class="pinpad-btn" data-d="8">8</button>
      <button type="button" class="pinpad-btn" data-d="9">9</button>
      <button type="button" class="pinpad-btn" id="pinpad-del">⌫</button>
      <button type="button" class="pinpad-btn" data-d="0">0</button>
      <button type="button" class="pinpad-btn pinpad-ok" id="pinpad-ok">OK</button>
    </div>
  </div>
</div>

<!-- TELA 2: MENU -->
<div id="screen-menu" class="screen">
  <div class="menu-topbar">
    <div class="t">Central DB</div>
  </div>
  <div class="menu-body">
    <div class="menu-grid">
      <div class="menu-card" onclick="openApp('HORTIFRUTI')"><span class="ic">🌿</span><span class="lbl">HORTIFRUTI</span></div>
      <div class="menu-card" onclick="openApp('LOCACOES')"><span class="ic">🏠</span><span class="lbl">LOCAÇÕES</span></div>
      <div class="menu-card" onclick="openApp('DESPESAS')"><span class="ic">💸</span><span class="lbl">DESPESAS</span></div>
      <div class="menu-card" onclick="openApp('EQUIPE')"><span class="ic">👥</span><span class="lbl">EQUIPE</span></div>
    </div>
  </div>
</div>

<!-- TELA 3: VISUALIZADOR DO APP -->
<div id="screen-viewer" class="screen">
  <div id="viewer-bar">
    <button onclick="closeApp()">← Voltar ao menu</button>
    <span class="app-name" id="viewer-app-name"></span>
  </div>
  <div id="viewer-loading">Carregando…</div>
  <iframe id="app-frame"></iframe>
</div>

<script>
const HUB_PASSWORD = '2000';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

// ══════════════════════════════════════════
//  PIN GATE PADRONIZADO (dots + input real + numpad)
// ══════════════════════════════════════════
let _pinBuf = '';
function _pinRender(err){
  for(let i=0;i<4;i++){
    const d=document.getElementById('dot-'+i);
    if(!d) continue;
    d.classList.toggle('filled', !err && i<_pinBuf.length);
    d.classList.toggle('error', err);
  }
}
function _pinSet(v){
  _pinBuf = v.replace(/\D/g,'').slice(0,4);
  const inp=document.getElementById('pin-input');
  if(inp) inp.value=_pinBuf;
  _pinRender(false);
  if(_pinBuf.length===4) setTimeout(_pinTry,120);
}
function _pinTry(){
  if(_pinBuf === HUB_PASSWORD){
    document.getElementById('pin-error').textContent='';
    showScreen('menu');
  } else {
    _pinRender(true);
    document.getElementById('pin-error').textContent='Senha incorreta.';
    setTimeout(()=>{ _pinSet(''); document.getElementById('pin-error').textContent=''; }, 700);
  }
}
document.addEventListener('DOMContentLoaded', function(){
  const inp=document.getElementById('pin-input');
  if(inp){
    inp.addEventListener('input', e=>_pinSet(e.target.value));
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') _pinTry(); });
    inp.focus();
  }
  document.querySelectorAll('.pinpad-btn[data-d]').forEach(b=>{
    b.addEventListener('click', ()=>_pinSet(_pinBuf+b.dataset.d));
  });
  const del=document.getElementById('pinpad-del');
  if(del) del.addEventListener('click', ()=>_pinSet(_pinBuf.slice(0,-1)));
  const ok=document.getElementById('pinpad-ok');
  if(ok) ok.addEventListener('click', _pinTry);
});

const APP_LABELS = {HORTIFRUTI:'HORTIFRUTI', LOCACOES:'LOCAÇÕES', DESPESAS:'DESPESAS', EQUIPE:'EQUIPE'};

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function openApp(key){
  const iframe = document.getElementById('app-frame');
  const loading = document.getElementById('viewer-loading');
  loading.style.display = 'flex';
  iframe.style.opacity = '0';
  document.getElementById('viewer-app-name').textContent = APP_LABELS[key];
  showScreen('viewer');
  const html = b64ToUtf8(APP_SOURCES[key]);
  iframe.onload = () => { loading.style.display = 'none'; iframe.style.opacity = '1'; };
  iframe.srcdoc = html;
}

function closeApp(){
  const iframe = document.getElementById('app-frame');
  iframe.srcdoc = '';
  iframe.src = 'about:blank';
  showScreen('menu');
}
</script>
